<dialog id="familiar-form-modal" class="modal-dialog">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="familiar-form-title">Registrar familiar</h2>
      <button type="button" class="secondary" id="familiar-form-close" aria-label="Cerrar">Cerrar</button>
    </div>
    <div id="familiar-form-body" class="modal-body"><p class="muted">Cargando formulario…</p></div>
  </div>
</dialog>
<style>
  .modal-dialog{border:none;padding:0;background:transparent;max-width:min(760px,96vw);width:calc(100% - 2rem);margin:auto;inset:0;max-height:calc(100vh - 2rem)}
  .modal-dialog::backdrop{background:rgba(15,23,42,.45)}
  .modal-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:calc(100vh - 2rem);overflow:auto}
  .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .modal-header h2{margin:0;font-size:1.2rem}
  .modal-body .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .modal-body .field label{display:block;font-weight:600;margin-bottom:4px}
  .modal-body .field input,.modal-body .field select,.modal-body .field textarea{width:100%}
  .modal-body .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
<script>
(function(){
  const modal=document.getElementById('familiar-form-modal');
  const body=document.getElementById('familiar-form-body');
  const title=document.getElementById('familiar-form-title');
  const close=document.getElementById('familiar-form-close');
  if(!modal||!body) return;
  function closeModal(){ if(modal.open) modal.close(); }
  if(close) close.addEventListener('click', closeModal);
  modal.addEventListener('click', function(event){ if(event.target===modal) closeModal(); });
  async function load(url, label){
    title.textContent=label || 'Familiar';
    body.innerHTML='<p class="muted">Cargando formulario…</p>';
    modal.showModal();
    const response=await fetch(url, {headers:{'X-Requested-With':'XMLHttpRequest'}});
    body.innerHTML=await response.text();
    bind();
  }
  function bind(){
    body.querySelectorAll('.js-modal-cancel').forEach(function(button){
      button.addEventListener('click', closeModal);
    });
    const form=body.querySelector('form');
    if(!form) return;
    form.addEventListener('submit', async function(event){
      event.preventDefault();
      const response=await fetch(form.action || window.location.href, {
        method:'POST',
        headers:{'X-Requested-With':'XMLHttpRequest'},
        body:new FormData(form)
      });
      if(response.redirected){ window.location.href=response.url; return; }
      const html=await response.text();
      if(response.ok){ window.location.reload(); return; }
      body.innerHTML=html;
      bind();
    });
  }
  document.querySelectorAll('.js-open-familiar-form').forEach(function(button){
    button.addEventListener('click', function(){
      load(button.dataset.modalUrl, button.dataset.modalTitle || 'Familiar');
    });
  });
})();
</script>
