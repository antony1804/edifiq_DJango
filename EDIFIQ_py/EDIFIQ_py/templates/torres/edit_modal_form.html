<form method="post" action="{% url role_ns|add:':edit' slug form.instance.pk %}?modal=1" class="torre-edit-form">
  {% csrf_token %}
  <input type="hidden" name="modal" value="1">
  {% if form.non_field_errors %}<div class="notice">{{ form.non_field_errors }}</div>{% endif %}
  <div class="form-grid">
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
      </div>
    {% endfor %}
  </div>
  <div class="actions">
    <button class="primary" type="submit">Guardar cambios</button>
    <button class="secondary" type="button" onclick="document.getElementById('torre-modal') && document.getElementById('torre-modal').close()">Cancelar</button>
  </div>
</form>
